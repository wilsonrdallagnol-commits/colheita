pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: pnpm biome check --write --staged && git add -u
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm -r typecheck

pre-push:
  commands:
    test:
      run: pnpm -r test

commit-msg:
  commands:
    conventional:
      run: node scripts/check-commit-msg.mjs {1}
