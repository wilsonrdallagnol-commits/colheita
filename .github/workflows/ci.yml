name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec biome check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Roda todos os packages com script de test via turbo.
      # Packages sem test script são ignorados automaticamente.
      # DB tests (que precisam de Postgres) skipam graciosamente sem DATABASE_URL.
      - run: pnpm test

  build:
    name: Build (Next apps)
    runs-on: ubuntu-latest
    # Roda apenas se typecheck passou — economiza CI compute quando ja temos erro de tipo
    needs: [typecheck]
    env:
      # Skips Vercel env injection — build deve passar com env stubs
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-stub-key
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: ci-stub-key
      DATABASE_URL: postgres://stub:stub@localhost/stub
      # Stubs pra evitar warn no Sentry init em CI
      SENTRY_DSN: ''
      NEXT_PUBLIC_SENTRY_DSN: ''
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build dos 4 apps Next em paralelo via turbo. Cataloga erros de
      # compile time (tipos OK mas import errado, syntax errado em ts->js,
      # next.config error, etc) que typecheck nao pega.
      - run: pnpm -r --filter "./apps/*" build

  rls:
    name: RLS isolation tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: colheita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/colheita_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # NOTA: o step "Run migrations" foi removido em 2026-05-08 porque
      # `pnpm db:migrate` roda contra Postgres vanilla (sem schema `auth` do
      # Supabase) e a primeira migration falha com `schema "auth" does not exist`.
      # Os testes RLS aplicam todas as migrations dentro de setupDb() com auth
      # stubs criados antes — isso ja cobre "migrations rodam corretamente".
      # Se quisermos validar migrations 0010+ contra Postgres vanilla, precisa
      # de refactor maior (auth stub script separado + extensao vector opcional).
      - name: Run RLS tests
        run: pnpm --filter @colheita/db test
